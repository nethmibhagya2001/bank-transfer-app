<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📜 Transaction History for Account: <span class="text-primary" th:text="${accountNumber}"></span></h2>
        <a th:href="@{/}" class="btn btn-secondary">Back to Dashboard</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body border-bottom">
            <strong>Total amount sent in successful transfers:</strong>
            LKR <span th:text="${totalSent}">0.00</span>
        </div>
        <div class="card-body table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>Transaction ID</th>
                        <th>Sender Account</th>
                        <th>Receiver Account</th>
                        <th>Amount (LKR)</th>
                        <th>Fee (LKR)</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(history)}">
                        <td colspan="8" class="text-center text-muted">No transactions found for this account.</td>
                    </tr>
                    <tr th:each="tx : ${history}">
                        <td th:text="${tx.id}"></td>
                        <td th:text="${tx.fromAccount}"></td>
                        <td th:text="${tx.toAccount}"></td>
                        <td th:text="${tx.amount}"></td>
                        <td th:text="${tx.fee != null ? tx.fee : '0.00'}"></td>
                        <td th:text="${tx.transactionType != null ? tx.transactionType : 'TRANSFER'}"></td>
                        <td>
                            <span th:class="${tx.status.name() == 'SUCCESS'} ? 'badge bg-success' : 'badge bg-danger'" th:text="${tx.status}"></span>
                        </td>
                        <td th:text="${#temporals.format(tx.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
