<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Large Transfers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Large Transfers</h2>
        <a th:href="@{/}" class="btn btn-secondary">Back to Dashboard</a>
    </div>

    <form th:action="@{/large-transfers}" method="get" class="row g-2 mb-4">
        <div class="col-auto">
            <label for="min" class="col-form-label">Minimum amount (LKR)</label>
        </div>
        <div class="col-auto">
            <input id="min" name="min" type="number" min="0" step="0.01" class="form-control" th:value="${minAmount}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Filter</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>Transaction ID</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Amount (LKR)</th>
                    <th>Fee (LKR)</th>
                    <th>Timestamp</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(transfers)}">
                    <td colspan="6" class="text-center text-muted">No successful transfers above this amount.</td>
                </tr>
                <tr th:each="tx : ${transfers}">
                    <td th:text="${tx.id}"></td>
                    <td th:text="${tx.fromAccount}"></td>
                    <td th:text="${tx.toAccount}"></td>
                    <td th:text="${tx.amount}"></td>
                    <td th:text="${tx.fee != null ? tx.fee : '0.00'}"></td>
                    <td th:text="${#temporals.format(tx.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
